<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Maria Júlia ❤️</title>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
margin-top:40px;
font-size:40px;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:15px;
background:#ff3b6f;
color:white;
cursor:pointer;
}

#mensagem{
display:none;
margin:20px;
font-size:24px;
}

img{
width:250px;
border-radius:20px;
margin:10px;
}

.heart{
position:fixed;
top:-20px;
color:red;
animation:cair 6s linear infinite;
}

@keyframes cair{
0%{transform:translateY(-10px);}
100%{transform:translateY(110vh);}
}
</style>
</head>

<body>

<h1>Maria Júlia ❤️</h1>

<button onclick="abrir()">Clique aqui ❤️</button>

<div id="mensagem">
<h2>Eu te amo muito ❤️</h2>
<p>Você é a melhor parte dos meus dias.</p>

<img src="file_00000000f584720eb606093041861c16.png">
<img src="Screenshot_20260713-160807~2.png">
<img src="Screenshot_20260715-174604.png">
  



<script>
function abrir(){
document.getElementById("mensagem").style.display="block";
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},6000);

},300);
</script>

</body>
</html>
